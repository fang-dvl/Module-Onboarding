<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form action="index.html" method="get">
        <label for="username">Username</label>
        <input type="text" name="name"id="name" placeholder="Enter your full name" minlength="2" required><br><br>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required><br><br>     
        <fieldset>
          <legend>Choose your color</legend>
          <input type="radio" name="color" id="red" value="red" required>
          <label for="red">Red</label>
          <input type="radio" name="color" id="blue" value="blue">
          <label for="blue">Blue</label>
          <input type="radio" name="color" id="green" value="green">
          <label for="green">Green</label><br><br>
        </fieldset>
        <fieldset>
        <legend>Choose your size</legend>
        <select id="size" required>
          <option value="" selected disabled></option>>Select a size</option>
          <option value="XS">XS</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
        </select><br>
        </fieldset><br>
        <button type="submit">Submit</button>
      </form>
    </main>
    <footer>
      <h2>By HOMEWORK SOLUTION</h2>
    </footer>
  </body>
</html>
